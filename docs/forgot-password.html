<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthiScan - Forgot Password</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h2>Forgot Password?</h2>
        <p class="auth-subtitle">Enter your registered email to continue</p>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label>EMAIL ADDRESS</label>
                <input type="email" id="forgotEmail" placeholder="you@example.com" required>
            </div>
            <div id="forgotMessage" style="display:none;margin-bottom:16px;padding:12px 14px;border-radius:8px;font-size:14px;"></div>
            <button type="submit" class="auth-btn">Verify Email →</button>
            <div class="auth-footer">
                <p>Remembered your password? <a href="login.html">← Sign In</a></p>
            </div>
        </form>
    </div>
    <script src="js/loader.js"></script>
</body>
</html>
