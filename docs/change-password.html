<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthiScan - Change Password</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h2>Change Password</h2>
        <p class="auth-subtitle">Create a new password for your EthiScan account</p>
        <form id="resetPasswordForm">
            <div class="form-group">
                <label>NEW PASSWORD</label>
                <input type="password" id="newPassword" placeholder="Minimum 8 characters" minlength="8" required>
            </div>
            <div class="form-group">
                <label>CONFIRM PASSWORD</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter your password" minlength="8" required>
            </div>
            <button type="submit" class="auth-btn">Change Password →</button>
            <div class="auth-footer">
                <p><a href="login.html">← Back to Sign In</a></p>
            </div>
        </form>
    </div>
    <script src="js/loader.js"></script>
</body>
</html>
